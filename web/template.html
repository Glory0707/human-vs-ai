.advice:last-of-type { border-bottom: none; }
.advice .tag {
  display: inline-block; min-width: 18px; text-align: center;

.advice.del .tag { background: rgba(179, 38, 30, 0.14); color: var(--sev-high); }

.counts {
  padding: 6px 0 12px; font-size: var(--fs-sm); color: var(--ink-2);

}
.counts b { font-variant-numeric: tabular-nums; color: var(--ink); }
.filters { display: flex; gap: 2px; }
.filters button {

  padding: 1px 8px; border-radius: 3px;
}
.filters button:hover:not(.on) { color: var(--ink); }
.filters button.on { color: var(--ink); background: var(--chip); font-weight: 600; }
@media (max-width: 900px) {
  main { flex-direction: column; }
  .pane { min-height: 45vh; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--hairline); }
  header { row-gap: 4px; padding: 10px 16px 8px; }
  header .note { flex-basis: 100%; margin-left: 0; }

  #input, #report { padding-left: 16px; padding-right: 16px; }
}

  </section>
</main>

<script>
const RULES_BY_PROFILE = __RULES_JSON__;
const SCORING = __SCORING_JSON__;
const PROFILES = Object.keys(RULES_BY_PROFILE);
/* 渲染共享层（web/render.js，构建注入）：转义/高亮/评分行/常量 */
const { esc, fmt, hiSentence, scoreRow, scoreNoteRow, hintsHtml,
        componentsText, SEV_NAME, PROFILE_META,
        HINTS_MAX, DISCLAIMER, ADVICE_FOOTER } = HvARender;
let currentProfile = PROFILES[0];
let currentMode = "analyze";
let debounceTimer = null;
let lastResult = null;   // 检测模式最近一次结果（复制按钮的数据源）
let lastAdvice = null;   // 改写模式最近一次结果
let adviceFilter = "all";
let copyResetTimer = null;

const reportEl = document.getElementById("report");
const inputEl = document.getElementById("input");
const copyBtn = document.getElementById("copyBtn");

function renderProfiles() {
  const nav = document.getElementById("profiles");
  nav.innerHTML = "";
  PROFILES.forEach(p => {
    const [label, desc] = PROFILE_META[p] || [p, ""];
    const b = document.createElement("button");
    b.textContent = label;
    b.title = desc;
    b.className = p === currentProfile ? "on" : "";
    // 改写建议只按 personal（其余三库没有删/改口径）
    if (currentMode === "rewrite" && p !== "personal") b.disabled = true;
    b.onclick = () => { currentProfile = p; renderProfiles(); analyzeNow(); };
    nav.appendChild(b);
  });
}

const MODES = [["analyze", "检测"], ["rewrite", "改写建议"]];
function renderModes() {
  const nav = document.getElementById("modes");
  nav.innerHTML = "";
  MODES.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = key === currentMode ? "on" : "";
    b.onclick = () => {
      currentMode = key;
      if (key === "rewrite") currentProfile = "personal";
      renderModes(); renderProfiles(); analyzeNow();
    };
    nav.appendChild(b);
  });
}

/* 同句多规则聚组（与 CLI _group_by_sentence 同口径），返回视图模型供
   屏幕渲染与 Markdown 导出共用——一份事实，两种出口 */
function buildGroups(F) {
  const groups = [];
  const byKey = new Map();
  const docLevel = [];
  F.forEach(f => {
    if (f.para < 0) { docLevel.push(f); return; }
    const key = f.para + "\u0000" + f.sentence;
    if (!byKey.has(key)) {
      const g = { para: f.para, sentence: f.sentence, items: [] };
      byKey.set(key, g);
      groups.push(g);
    }
    byKey.get(key).items.push(f);
  });
  const sevRank = { high: 0, medium: 1, low: 2 };
  groups.sort((a, b) => {
    const ra = Math.min(...a.items.map(i => sevRank[i.severity]));
    const rb = Math.min(...b.items.map(i => sevRank[i.severity]));
    return (ra - rb) || (a.para - b.para);
  });
  docLevel.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]);
  return { groups, docLevel, sevRank };
}

function statsRows(s) {
  const rows = [`规模：${s.n_paragraphs} 段 · ${s.n_sentences} 句 · ${s.n_chars} 字`];
  // 统计行只在样本够判定时展示（与 doc 规则的 min_sentences=8 同口径）：
  // 一两句话的文本里 CV 全是"—"、TTR 恒为 1，展示出来全是噪音
  if (s.n_sentences < 8) return rows;
  rows.push(`节奏：句长 CV ${fmt(s.sentence_cv)} · 段长 CV ${fmt(s.para_len_cv)}`);
  rows.push(`词汇：TTR ${fmt(s.ttr)} · 连接词密度 ${fmt(s.conn_density)}${s.conn_density === s.conn_density ? " 条/句" : ""} · 4-gram 重复率 ${fmt(s.ngram_repeat)}`);
  return rows;
}

function renderReport(result) {
  if (!result) return;
  const parts = [];

  parts.push(`<div class="stats">${scoreRow(result.score)}${scoreNoteRow(result.score_note)}${statsRows(result.stats).map(r => `<div class="row">${r}</div>`).join("")}</div>`);

  const F = result.findings;
  const bySev = { high: [], medium: [], low: [] };
  F.forEach(f => bySev[f.severity].push(f));
  const dist = ["high", "medium", "low"].filter(sv => bySev[sv].length)
    .map(sv => `${SEV_NAME[sv]} ${bySev[sv].length}`).join(" · ");
  parts.push(`<div class="summary">${F.length ? `发现 ${F.length} 处（${dist}）` : "未发现模板化写作"}</div>`);

  const explained = new Set();
  const { groups, docLevel, sevRank } = buildGroups(F);
  groups.forEach(g => {
    const top = g.items.reduce((acc, i) =>
      (sevRank[i.severity] < sevRank[acc.severity] ? i : acc), g.items[0]);
    const ids = g.items.map(i => i.rule_id).join(" + ");
    const names = g.items.map(i => i.rule_name).join(" + ");
    const taste = [...new Set(g.items.map(i => i.taste).filter(Boolean))].join("/");
    const matchArr = [...new Set(g.items.flatMap(i => i.matches))];
    const why = g.items.find(i => !explained.has(i.rule_id));
    if (why) explained.add(why.rule_id);
    g.items.forEach(i => explained.add(i.rule_id));
    parts.push(`<div class="found">
      <div class="head"><span class="dot" style="background:var(--sev-${top.severity})"></span>${SEV_NAME[top.severity]} · ${esc(ids)} ${esc(names)}${taste ? `<span class="taste">${esc(taste)}</span>` : ""}<span class="loc">¶${g.para + 1}</span></div>
      ${g.sentence ? `<blockquote>${hiSentence(g.sentence, matchArr)}</blockquote>` : ""}
      ${matchArr.length ? `<div class="match">命中：<code>${esc(matchArr.join("、"))}</code></div>` : ""}
      ${why ? `<div class="why">${esc(why.explanation.trim())}</div>${why.suggestion ? `<div class="tip">→ ${esc(why.suggestion.trim())}</div>` : ""}` : ""}
    </div>`);
  });
  docLevel.forEach(f => {
    const taste = f.taste ? `<span class="taste">${esc(f.taste)}</span>` : "";
    const why = !explained.has(f.rule_id);
    explained.add(f.rule_id);
    parts.push(`<div class="found">
      <div class="head"><span class="dot" style="background:var(--sev-${f.severity})"></span>${SEV_NAME[f.severity]} · ${esc(f.rule_id)} ${esc(f.rule_name)}${taste}<span class="loc">全文</span></div>
      ${f.matches.length ? `<div class="match">命中：<code>${esc([...new Set(f.matches)].join("、"))}</code></div>` : ""}
      ${why ? `<div class="why">${esc(f.explanation.trim())}</div>${f.suggestion ? `<div class="tip">→ ${esc(f.suggestion.trim())}</div>` : ""}` : ""}
    </div>`);
  });

  parts.push(hintsHtml(result.hints));

  parts.push(`<div class="disclaimer">${DISCLAIMER}</div>`);
  reportEl.innerHTML = parts.join("");
}

const EMPTY_REPORT = '<div class="empty">粘贴正文即出报告。</div>';

const ADVICE_META = { "删": ["del", "删"], "改": ["chg", "改"], "保留": ["keep", "留"] };
const FILTERS = [["all", "全部"], ["删", "删"], ["改", "改"], ["保留", "留"]];

function renderAdvice() {
  const A = lastAdvice ? lastAdvice.advices : [];
  const n = k => A.filter(a => a.action === k).length;
  const parts = [`<div class="counts"><span>共 <b>${A.length}</b> 条 · 删 <b>${n("删")}</b> · 改 <b>${n("改")}</b> · 保留 <b>${n("保留")}</b></span>` +
    `<span class="filters">${FILTERS.map(([key, label]) =>
      `<button class="${adviceFilter === key ? "on" : ""}" data-f="${key}">${label}</button>`).join("")}</span></div>`];
  const shown = adviceFilter === "all" ? A : A.filter(a => a.action === adviceFilter);
  if (!shown.length && A.length) parts.push('<div class="empty">该档位没有条目。</div>');
  shown.forEach(a => {
    const [cls, label] = ADVICE_META[a.action] || ["keep", "?"];
    const taste = a.taste.length ? `<span class="taste">${esc(a.taste.join("/"))}</span>` : "";
    parts.push(`<div class="advice ${cls}">
      <div class="line"><span class="tag">${label}</span>${esc(a.text)}${taste}</div>
      ${a.reason ? `<div class="why">${esc(a.reason)}</div>` : ""}
      ${a.candidate ? `<div class="cand">→ ${esc(a.candidate)}</div>` : ""}
      ${a.direction ? `<div class="dir">→ ${esc(a.direction)}</div>` : ""}
    </div>`);
  });
  parts.push(`<div class="disclaimer">${ADVICE_FOOTER}</div>`);
  reportEl.innerHTML = parts.join("");
  reportEl.querySelectorAll(".filters button").forEach(b => {
    b.onclick = () => { adviceFilter = b.dataset.f; renderAdvice(); };
  });
}

function analyzeNow() {
  clearTimeout(debounceTimer);
  const text = inputEl.value;
  if (!text.trim()) {
    // 空文本不给"未发现"的假全清判定，回到初始提示
    lastResult = lastAdvice = null;
    updateCopyBtn();
    reportEl.innerHTML = EMPTY_REPORT;
    return;
  }
  // 大文本同步分析会冻结输入框：先给出反馈，等一帧再算
  if (text.length > 60000) {
    reportEl.innerHTML = '<div class="empty">分析中…</div>';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (inputEl.value !== text) return;  // 过期任务：输入已变
      doAnalyze(text);
    }));
  } else {
    doAnalyze(text);
  }
}

function doAnalyze(text) {
  const rules = RULES_BY_PROFILE[currentProfile];
  if (currentMode === "rewrite") {
    lastAdvice = HvARewrite.rewriteText(text, rules);
    renderAdvice();
  } else {
    lastResult = HvA.analyze(text, rules, SCORING[currentProfile] || null);
    renderReport(lastResult);
  }
  updateCopyBtn();
}

function updateCopyBtn() {
  copyBtn.disabled = !(lastResult || lastAdvice);
}

function reportToMarkdown() {
  const r = lastResult;
  if (!r) return "";
  const label = (PROFILE_META[currentProfile] || [currentProfile])[0];
  const L = [];
  L.push(`# human-vs-ai 分析报告（${label}）`, "");
  L.push("## 全文统计", "");
  if (r.score) {
    L.push(`- AI 味指数：${r.score.index.toFixed(0)} / 100（风格分，不是 AI 概率）`);
    const comps = componentsText(r.score.components);
    if (comps) L.push(`- 构成：${comps}`);
  } else if (r.score_note) {
    L.push(`- AI 味指数：—（${r.score_note}）`);
  }
  statsRows(r.stats).forEach(row => L.push(`- ${row}`));
  L.push("", `## 发现（${r.findings.length} 处）`, "");
  if (!r.findings.length) L.push("未发现模板化写作。");
  const explained = new Set();
  const { groups, docLevel, sevRank } = buildGroups(r.findings);
  groups.forEach(g => {
    const top = g.items.reduce((acc, i) =>
      (sevRank[i.severity] < sevRank[acc.severity] ? i : acc), g.items[0]);
    const ids = g.items.map(i => i.rule_id).join(" + ");
    const names = g.items.map(i => i.rule_name).join(" + ");
    const matchArr = [...new Set(g.items.flatMap(i => i.matches))];
    L.push(`### [${SEV_NAME[top.severity]}] ${ids} ${names} · ¶${g.para + 1}`, "");
    if (g.sentence) L.push(`> ${g.sentence}`, "");
    if (matchArr.length) L.push(`**命中**：${matchArr.join("、")}`, "");
    const why = g.items.find(i => !explained.has(i.rule_id));
    g.items.forEach(i => explained.add(i.rule_id));
    if (why) {
      L.push(why.explanation.trim());
      if (why.suggestion) L.push("", `**建议**：${why.suggestion.trim()}`);
      L.push("");
    }
  });
  docLevel.forEach(f => {
    const why = !explained.has(f.rule_id);
    explained.add(f.rule_id);
    L.push(`### [${SEV_NAME[f.severity]}] ${f.rule_id} ${f.rule_name}${f.taste ? ` · ${f.taste}` : ""}（全文）`, "");
    if (f.matches.length) L.push(`**命中**：${[...new Set(f.matches)].join("、")}`, "");
    if (why) {
      L.push(f.explanation.trim());
      if (f.suggestion) L.push("", `**建议**：${f.suggestion.trim()}`);
      L.push("");
    }
  });
  if (r.hints.length) {
    L.push(`## 弱命中（共 ${r.hints.length} 处）`, "");
    r.hints.slice(0, HINTS_MAX).forEach(h =>
      L.push(`- ${h.rule_id} ${h.rule_name}（¶${h.para + 1}）`));
    if (r.hints.length > HINTS_MAX) L.push(`- …等 ${r.hints.length} 处`);
    L.push("");
  }
  L.push("---", "", DISCLAIMER);
  return L.join("\n");
}

function adviceToMarkdown() {
  const A = lastAdvice ? lastAdvice.advices : null;
  if (!A) return "";
  const n = k => A.filter(a => a.action === k).length;
  const L = ["# human-vs-ai 改写建议（我的口味）", "",
    `共 ${A.length} 条 · 删 ${n("删")} · 改 ${n("改")} · 保留 ${n("保留")}`, ""];
  A.forEach(a => {
    L.push(`[${a.action}]${a.taste.length ? " " + a.taste.join("/") : ""} ${a.text}`);
    if (a.reason) L.push(`  ${a.reason}`);
    if (a.candidate) L.push(`  → ${a.candidate}`);
    else if (a.direction) L.push(`  → ${a.direction}`);
    L.push("");
  });
  L.push("---", "", ADVICE_FOOTER);
  return L.join("\n");
}

copyBtn.onclick = async () => {
  const md = currentMode === "rewrite" ? adviceToMarkdown() : reportToMarkdown();
  if (!md) return;
  let ok = false;
  try {
    await navigator.clipboard.writeText(md);
    ok = true;
  } catch (e) {
    // file:// 或旧浏览器没有 async clipboard：退回隐藏选区复制
    const ta = document.createElement("textarea");
    ta.value = md;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  copyBtn.textContent = ok ? "已复制 ✓" : "复制失败";
  clearTimeout(copyResetTimer);
  copyResetTimer = setTimeout(() => { copyBtn.textContent = "复制 Markdown"; }, 1600);
};

inputEl.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  // 大文本分析耗时按长度走：阈值上调防抖间隔，避免打字被卡
  const delay = inputEl.value.length > 30000 ? 800 : 300;
  debounceTimer = setTimeout(analyzeNow, delay);
});

renderProfiles();
renderModes();
</script>
