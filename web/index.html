<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>human-vs-ai · 中文 AI 味分析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1A18'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root {
  --paper: #FFFFFF;
  --hairline: #E5E5E3;
  --ink: #1A1A18;
  --ink-2: #6E6E6A;
  --ink-3: #8A8A86;
  --sev-high: #B3261E;
  --sev-medium: #9A6B00;
  --sev-low: #0F766E;
  --sev-hint: #8A8A86;
  --fs-md: 13px;
  --fs-sm: 12px;
  --fs-xs: 10.5px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: var(--fs-md);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 14px 24px 12px;
  border-bottom: 1px solid var(--hairline);
  flex-wrap: wrap;
}
.wordmark { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.wordmark .v { color: var(--ink-3); font-weight: 400; font-size: var(--fs-xs); margin-left: 6px; font-variant-numeric: tabular-nums; }
.profiles { display: flex; gap: 2px; }
.profiles button {
  border: none; background: none; cursor: pointer;
  font: inherit; font-size: var(--fs-sm); color: var(--ink-2);
  padding: 2px 10px; border-radius: 3px;
}
.profiles button.on { color: var(--ink); background: #F4F4F2; font-weight: 600; }
.modes { display: flex; gap: 2px; margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--hairline); }
.modes button {
  border: none; background: none; cursor: pointer;
  font: inherit; font-size: var(--fs-sm); color: var(--ink-2);
  padding: 2px 10px; border-radius: 3px;
}
.modes button.on { color: var(--ink); background: #F4F4F2; font-weight: 600; }
header .note { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-3); }
main { flex: 1; display: flex; min-height: 0; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--hairline); }
.pane-label {
  font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600;
  letter-spacing: 0.04em; padding: 10px 24px 6px;
}
#input {
  flex: 1; border: none; resize: none; outline: none;
  padding: 8px 24px 24px; font: inherit; line-height: 1.8;
  color: var(--ink); background: var(--paper);
}
#input::placeholder { color: #B8B8B4; }
#report { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
.stats { padding: 6px 0 14px; border-bottom: 1px solid var(--hairline); }
.stats .row { font-size: var(--fs-sm); color: var(--ink-2); }
.stats .row + .row { margin-top: 2px; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.summary { padding: 12px 0 4px; font-weight: 600; }
.found { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.found:last-of-type { border-bottom: none; }
.found .head { font-weight: 600; }
.found .head .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.found .head .loc { color: var(--ink-3); font-weight: 400; font-size: var(--fs-xs); margin-left: 8px; }
.found blockquote {
  margin: 6px 0 4px; padding: 2px 0 2px 12px;
  border-left: 2px solid var(--hairline); color: var(--ink-2);
}
.found .match { font-size: var(--fs-sm); color: var(--ink-3); margin: 2px 0 6px; }
.found .match code { background: #F4F4F2; padding: 0 4px; border-radius: 2px; }
.found .why { margin: 3px 0; }
.found .tip { color: var(--sev-low); margin-top: 3px; }
.hints { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--hairline); }
.hints .t { font-size: var(--fs-sm); color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
.hints .h { font-size: var(--fs-sm); color: var(--ink-3); }
.disclaimer {
  margin-top: 18px; padding: 10px 14px; background: #FAFAF8;
  font-size: var(--fs-xs); color: var(--ink-3); border-radius: 3px;
}
.empty { color: var(--ink-3); padding: 24px 0; }
.empty b { color: var(--ink); }
.advice { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.advice:last-of-type { border-bottom: none; }
.advice .line { }
.advice .tag {
  display: inline-block; min-width: 18px; text-align: center;
  font-size: var(--fs-xs); font-weight: 600; border-radius: 2px;
  padding: 1px 5px; margin-right: 8px; vertical-align: 1px;
  background: #F4F4F2; color: var(--ink-2);
}
.advice.del .tag { background: #FBE9E7; color: var(--sev-high); }
.advice.chg .tag { background: #FFF4E0; color: var(--sev-medium); }
.advice.keep .tag { background: #E6F4F2; color: var(--sev-low); }
.advice .taste { font-size: var(--fs-xs); color: var(--ink-3); margin-left: 6px; }
.advice .why { color: var(--ink-2); margin: 4px 0 0 26px; }
.advice .cand { color: var(--sev-low); margin: 3px 0 0 26px; }
.advice .dir { color: var(--ink-3); margin: 3px 0 0 26px; font-size: var(--fs-sm); }
.advice .counts { padding: 6px 0 12px; font-size: var(--fs-sm); color: var(--ink-2); border-bottom: 1px solid var(--hairline); }
@media (max-width: 900px) {
  main { flex-direction: column; }
  .pane { min-height: 45vh; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--hairline); }
  header { row-gap: 4px; }
  header .note { flex-basis: 100%; margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <span class="wordmark">human-vs-ai<span class="v">0.7.0</span></span>
  <nav class="profiles" id="profiles"></nav>
  <nav class="modes" id="modes"></nav>
  <span class="note">纯本地分析 · 文本不上传</span>
</header>
<main>
  <section class="pane">
    <div class="pane-label">粘贴文本</div>
    <textarea id="input" placeholder="把文章、论文段落或回答粘贴到这里。

Markdown 标题、列表与代码块会跳过，只分析正文。"></textarea>
  </section>
  <section class="pane">
    <div class="pane-label">分析报告</div>
    <div id="report"><div class="empty">粘贴文本即出报告。</div></div>
  </section>
</main>
<script>
/* human-vs-ai 浏览器引擎——与 Python 包 human_vs_ai 同构的第二实现。
 *
 * 存在理由:纯前端网页版(file:// 打开即用,零安装零上传)。
 * 纪律:两个实现的输出必须逐字段一致——tools/check_web_consistency.py
 * 用固定语料对比 Python 与本文件的 findings/hints JSON,任何漂移都会被
 * 测试抓住。改动切分或统计逻辑时两端必须同步改。
 *
 * 口径说明:浏览器没有 jieba,tokenize 退化为字级 2-gram(与 Python 无
 * jieba 时同口径)。TTR 数值因此与 Python(装了 jieba)不同,但两个
 * profile 的规则库都没有 TTR 判定规则,D-UNIF/D-CONN/D-PARA/D-NGRAM/
 * D-DASH 全部与分词无关——一致性不受影响。
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.HvA = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var SENT_END = "。！？；…!?;";
  var OPEN_Q_RE = /[\u201C\u300E\u300C]/;
  var CLOSE_Q_RE = /[\u201D\u300F\u300D]/;
  var STRUCT_RE = /^\s*(```|~~~|#{1,6}\s|\||\*|[-+]\s|\d+\.\s|===|---)/;
  var PUNCT_RE = /[，。！？；：、…\u201C\u201D\u2018\u2019《》（）()[\]【】,\.!\?;:\u0022\u0027—\-\s]/g;

  function stripMarkdown(text) {
    var out = [];
    var inCode = false;
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var s = line.trim();
      if (s.indexOf("```") === 0 || s.indexOf("~~~") === 0) {
        inCode = !inCode;
        out.push("");
        continue;
      }
      if (inCode) continue;
      if (!s) { out.push(""); continue; }
      if (STRUCT_RE.test(line)) { out.push(""); continue; }
      var cleaned = line.replace(/`([^`]*)`/g, "$1");
      cleaned = cleaned.replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1");
      cleaned = cleaned.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
      out.push(cleaned);
    }
    return out.join("\n");
  }

  function splitParagraphs(text) {
    var paras = [];
    var cur = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim()) cur.push(lines[i].trim());
      else if (cur.length) { paras.push(cur.join("\n")); cur = []; }
    }
    if (cur.length) paras.push(cur.join("\n"));
    return paras;
  }

  /* 引号嵌套:与 Python 相同——开引号加深、闭引号减浅,深处句末标点不算边界 */
  function splitSentences(text) {
    var sents = [];
    var depth = 0, start = 0;
    var n = text.length;
    for (var i = 0; i < n; i++) {
      var ch = text[i];
      if (OPEN_Q_RE.test(ch)) { depth++; continue; }
      if (CLOSE_Q_RE.test(ch)) {
        if (depth > 0) depth--;
        continue;
      }
      /* ASCII 双引号按奇偶切换；ASCII 单引号不参与——英文所有格/缩写
         （it's）远比引语常见，拿它当引号会吞后续句末标点（与 Python 同步） */
      if (ch === "\u0022") {
        depth = depth ? 0 : 1;
        continue;
      }
      if (depth > 0) continue;
      if (SENT_END.indexOf(ch) >= 0) {
        var j = i + 1;
        while (j < n && SENT_END.indexOf(text[j]) >= 0) j++;
        var body = text.slice(start, j).trim();
        if (body) sents.push({ text: body, para: 0 });
        start = j;
      }
    }
    var tail = text.slice(start).trim();
    if (tail) sents.push({ text: tail, para: 0 });
    return sents;
  }

  function splitDocument(text) {
    var clean = stripMarkdown(text);
    var paras = splitParagraphs(clean);
    var out = [];
    for (var pi = 0; pi < paras.length; pi++) {
      var sents = splitSentences(paras[pi]);
      for (var si = 0; si < sents.length; si++) sents[si].para = pi;
      out.push(sents);
    }
    return out;
  }

  /* ---------- 统计 ---------- */

  function mean(xs) {
    if (!xs.length) return NaN;
    var s = 0;
    for (var i = 0; i < xs.length; i++) s += xs[i];
    return s / xs.length;
  }

  function cv(xs) {
    if (xs.length < 3) return NaN;
    var m = mean(xs);
    if (!m) return NaN;
    var v = 0;
    for (var i = 0; i < xs.length; i++) v += (xs[i] - m) * (xs[i] - m);
    v = v / (xs.length - 1);
    return Math.sqrt(v) / m;
  }

  function tokenize(text) {
    var clean = text.replace(PUNCT_RE, "");
    if (clean.length < 2) return clean.split("");
    var out = [];
    for (var i = 0; i < clean.length - 1; i++) out.push(clean.slice(i, i + 2));
    return out;
  }

  function mattr(tokens, window) {
    window = window || 100;
    if (!tokens.length) return NaN;
    if (tokens.length <= window) {
      var set = {};
      var uniq = 0;
      for (var i = 0; i < tokens.length; i++) {
        if (!set[tokens[i]]) { set[tokens[i]] = 1; uniq++; }
      }
      return uniq / tokens.length;
    }
    var vals = [];
    for (var s = 0; s + window <= tokens.length; s++) {
      var seen = {};
      var u = 0;
      for (var k = s; k < s + window; k++) {
        if (!seen[tokens[k]]) { seen[tokens[k]] = 1; u++; }
      }
      vals.push(u / window);
    }
    return mean(vals);
  }

  function fourGramRepeat(text) {
    var clean = text.replace(PUNCT_RE, "");
    if (clean.length < 8) return 0.0;
    var grams = {};
    var total = 0;
    for (var i = 0; i + 4 <= clean.length; i++) {
      var g = clean.slice(i, i + 4);
      grams[g] = (grams[g] || 0) + 1;
      total++;
    }
    if (!total) return 0.0;
    var repeated = 0;
    for (var key in grams) if (grams[key] > 1) repeated += grams[key] - 1;
    return repeated / total;
  }

  var DENSITY_PREFIXES = ["L-CONN", "O-STK"]; /* 与 Python _DENSITY_PREFIXES 同步 */

  function connectiveLexicon(rules) {
    var lex = {};
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      var hitPrefix = false;
      for (var pi = 0; pi < DENSITY_PREFIXES.length; pi++) {
        if (r.id.indexOf(DENSITY_PREFIXES[pi]) === 0) { hitPrefix = true; break; }
      }
      if (!hitPrefix) continue;
      var pats = r.patterns || [];
      for (var j = 0; j < pats.length; j++) {
        var p = pats[j];
        if (p.length <= 8 && !/[\[\]\(\)\{\}\*\+\?\.\|\\]/.test(p)) lex[p] = 1;
      }
    }
    return Object.keys(lex);
  }

  function computeDocStats(paraSents, lexicon) {
    var allSents = [];
    for (var p = 0; p < paraSents.length; p++)
      for (var s = 0; s < paraSents[p].length; s++) allSents.push(paraSents[p][s].text);
    var lens = allSents.map(function (t) { return t.replace(PUNCT_RE, "").length; });
    var paraLens = paraSents.map(function (para) {
      var n = 0;
      for (var i = 0; i < para.length; i++) n += para[i].text.replace(PUNCT_RE, "").length;
      return n;
    });
    var fullText = allSents.join("");
    var tokens = tokenize(fullText);
    var stats = {
      n_paragraphs: paraSents.length,
      n_sentences: allSents.length,
      n_chars: lens.reduce(function (a, b) { return a + b; }, 0),
      sentence_cv: cv(lens),
      para_len_cv: cv(paraLens),
      ttr: mattr(tokens),
      conn_density: NaN,
      ngram_repeat: fourGramRepeat(fullText),
      avg_sentence_len: mean(lens),
      dash_density: NaN,
      tokenizer: "char-2gram",
    };
    if (lexicon && lexicon.length) {
      var count = 0;
      for (var si = 0; si < allSents.length; si++)
        for (var li = 0; li < lexicon.length; li++) {
          var word = lexicon[li], idx = 0, from = 0;
          while ((idx = allSents[si].indexOf(word, from)) >= 0) { count++; from = idx + word.length; }
        }
      stats.conn_density = allSents.length ? count / allSents.length : NaN;
    }
    /* 破折号计数与 Python 同口径：非重叠"——"对数 + 落单的"—"。
       连跑三个以上时按 run 拆（"———"= 1 对 + 1 单），不能数 run 数——
       数 run 数会让 "———" 在两端各算各的（一致性检查实证过的漂移） */
    var nDouble = 0, nSingle = 0, run = 0;
    for (var ci = 0; ci <= fullText.length; ci++) {
      if (fullText[ci] === "—") { run++; continue; }
      if (run) { nDouble += Math.floor(run / 2); nSingle += run % 2; run = 0; }
    }
    stats.dash_density = allSents.length ? (nDouble + nSingle) / allSents.length : NaN;
    return stats;
  }

  /* ---------- 引擎 ---------- */

  function compileRules(rules) {
    return rules.map(function (r) {
      var out = {};
      for (var k in r) out[k] = r[k];
      out._patterns = (r.patterns || []).map(function (p) {
        return new RegExp(p);
      });
      out.doc_threshold = r.doc_threshold == null ? NaN : r.doc_threshold;
      out.doc_tiers = (r.doc_tiers || []).map(function (t) {
        return [t[0] == null ? null : t[0], t[1]];
      });
      out.min_sentences = r.min_sentences == null ? 8 : r.min_sentences;
      return out;
    });
  }

  function analyze(text, rules) {
    rules = compileRules(rules);
    var doc = splitDocument(text);
    var findings = [], hints = [];
    var raw = {};

    function push(rule, f) {
      if (!raw[rule.id]) raw[rule.id] = [];
      raw[rule.id].push(f);
    }

    for (var pi = 0; pi < doc.length; pi++) {
      var para = doc[pi];
      for (var si = 0; si < para.length; si++) {
        var sent = para[si];
        for (var ri = 0; ri < rules.length; ri++) {
          var rule = rules[ri];
          if (rule.scope !== "sentence") continue;
          var matches = [];
          for (var mi = 0; mi < rule._patterns.length; mi++) {
            var m = rule._patterns[mi].exec(sent.text);
            if (m) matches.push(m[0]);
          }
          if (matches.length) {
            push(rule, {
              rule_id: rule.id, rule_name: rule.name, severity: rule.severity,
              tier: rule.tier, para: pi, sentence: sent.text, matches: matches,
              explanation: rule.explanation || "", suggestion: rule.suggestion || "",
              taste: rule.taste || "",
            });
          }
        }
      }
      for (var ri2 = 0; ri2 < rules.length; ri2++) {
        var rule2 = rules[ri2];
        if (rule2.scope !== "shape") continue;
        if (rule2.doc_metric === "one_liner" && para.length === 1 && para[0].text.length <= 40) {
          push(rule2, {
            rule_id: rule2.id, rule_name: rule2.name, severity: rule2.severity,
            tier: rule2.tier, para: pi, sentence: para[0].text,
            matches: ["独句段（" + para[0].text.length + " 字）"],
            explanation: rule2.explanation || "", suggestion: rule2.suggestion || "",
            taste: rule2.taste || "",
          });
        }
      }
    }

    for (var rid in raw) {
      var hits = raw[rid];
      if (hits[0].severity === "low" && hits.length < 2) {
        hints = hints.concat(hits);
      } else {
        findings = findings.concat(hits);
      }
    }

    var stats = computeDocStats(
      doc, connectiveLexicon(rules)
    );
    for (var di = 0; di < rules.length; di++) {
      var drule = rules[di];
      if (drule.scope !== "doc" || !drule.doc_metric) continue;
      var value = stats[drule.doc_metric];
      if (typeof value !== "number" || isNaN(value)) continue;
      if (stats.n_sentences < drule.min_sentences) continue; /* 短文本统计不判 */
      /* 分档阈值：与 Python _doc_threshold 同构——按 n_chars 依次匹配
         chars<上限，未命中用兜底阈值 */
      var thr = drule.doc_threshold;
      for (var ti = 0; ti < drule.doc_tiers.length; ti++) {
        var lim = drule.doc_tiers[ti][0];
        if (lim === null || stats.n_chars < lim) { thr = drule.doc_tiers[ti][1]; break; }
      }
      var hit = drule.doc_compare === "below" ? value < thr : value > thr;
      if (hit) {
        findings.push({
          rule_id: drule.id, rule_name: drule.name, severity: drule.severity,
          tier: drule.tier, para: -1, sentence: "",
          matches: [drule.doc_metric + "=" + value.toFixed(3) + "（阈值 " + thr.toFixed(2) + "）"],
          explanation: drule.explanation || "", suggestion: drule.suggestion || "",
          taste: drule.taste || "",
        });
      }
    }

    var SEV = { high: 3, medium: 2, low: 1, hint: 0 };
    findings.sort(function (a, b) {
      return (SEV[b.severity] - SEV[a.severity]) || (a.para - b.para);
    });
    return { findings: findings, hints: hints, stats: stats };
  }

  return {
    analyze: analyze,
    splitDocument: splitDocument,
    splitSentences: splitSentences,
    splitParagraphs: splitParagraphs,
    stripMarkdown: stripMarkdown,
    computeDocStats: computeDocStats,
    tokenize: tokenize,
    mattr: mattr,
    fourGramRepeat: fourGramRepeat,
  };
});

</script>
<script>
/* human-vs-ai 浏览器改写器——与 human_vs_ai/rewrite.py 同构的第二实现。
 *
 * 存在理由：网页版要在浏览器里直接给改写建议（零后端）。
 * 纪律：与 Python 端逐字段一致，由 tools/check_web_consistency.py 的
 * rewrite 探针守护（候选、方向、动作、口味编号全部对比）。
 *
 * 最高优先准则（R1，docs/taste_zhouao.md）：不是一味的删减，而是该多说时
 * 多说，该少说时少说，重要数据和结论要保留——所以含数字/结论的句子先进
 * 保留档，腔调规则不覆盖它。
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.HvARewrite = factory();
  }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var KEEP = "保留", REWRITE = "改", DELETE = "删";

  /* R1 重要内容判据（不含中文数词+量词——文案里的量词不是数据） */
  var IMPORTANT_RE = /\d|%|％|[一二三四五六七八九十百千万]+(倍|万|亿|人天|分钟)|(结论|结果表明|数据显示|实测|验证|复现|报错|错误码|失败率|通过率|达标|未达标)/;
  /* R3 具体名词 / 梗 */
  var NOUN_RE = /(DDL|deadline|组会|参考文献|文献|论文|paper|Paper|accept|数据|导师|大佬|咖啡|午饭|午休|书桌|台灯|日历|邮件|报错|日志|版本|分支|草稿|推文|稿子)/;
  var MEME_RE = /(牛马|摸鱼|摆烂|连滚带爬|火葬场|狠人|卷王|躺平)/;

  function stripTrailingParen(text) {
    return text.replace(/[（(][^）)]*[）)]\s*$/, "").trim();
  }

  function splitHeads(body) {
    return body.split(/[，,]/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  /* 规则化改写：返回 [候选, 方向, 驱动规则 id] */
  function mechanicalCandidate(text, ruleIds) {
    var body = stripTrailingParen(text.replace(/[。！？～]+$/, "")).trim();
    var heads = splitHeads(body);
    var has = function (id) { return ruleIds.indexOf(id) >= 0; };

    var manual = null;
    for (var i = 0; i < ruleIds.length; i++) {
      if (ruleIds[i].indexOf("T-MANUAL") === 0) { manual = ruleIds[i]; break; }
    }
    if (manual) return ["", "整句删（本人口径：功能说明不保留、不压缩）", manual];
    if (has("T-VOICE-05")) return ["", "整句删；要表达关心就一句话，别加理由", "T-VOICE-05"];
    if (has("T-VOICE-01") && heads.length >= 2) return [heads[0] + "。", "", "T-VOICE-01"];
    if (has("T-VOICE-02") && heads.length >= 2) return [heads[0] + "。", "", "T-VOICE-02"];
    if (has("T-VOICE-07")) {
      var m = body.match(/^[^，,]{0,10}的你[，,]\s*(.+)$/);
      if (m) return [m[1].trim() + "。", "", "T-VOICE-07"];
    }
    if (has("T-VOICE-11")) {
      return [body.replace(/^(综上所述|总而言之|总的来说|由此可见|不得不说)[，,]?\s*/, "") + "。",
        "", "T-VOICE-11"];
    }
    var slogan = ["T-VOICE-10", "T-VOICE-12", "T-VOICE-04"];
    for (var j = 0; j < slogan.length; j++) {
      if (has(slogan[j])) return ["", "整句删（口号/顺口溜/效率承诺没有信息量）", slogan[j]];
    }
    var hint = "删掉腔调半句，只留事实";
    if (!NOUN_RE.test(body) && !MEME_RE.test(body)) {
      hint += "；再补一个具体名词或梗来承载信息";
    }
    return ["", hint, ruleIds.length ? ruleIds[0] : ""];
  }

  function compile(rules) {
    return rules.map(function (r) {
      return {
        id: r.id, name: r.name, severity: r.severity, taste: r.taste || "",
        explanation: r.explanation || "", scope: r.scope,
        _patterns: (r.patterns || []).map(function (p) { return new RegExp(p); }),
      };
    });
  }

  function classifyLine(text, rules) {
    var line = String(text).trim();
    if (!line) return { text: text, action: KEEP, taste: [], rules: [], reason: "",
                        candidate: "", direction: "" };
    var hits = [];
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (r.scope !== "sentence") continue;
      for (var j = 0; j < r._patterns.length; j++) {
        if (r._patterns[j].test(line)) { hits.push(r); break; }
      }
    }

    if (IMPORTANT_RE.test(line)) {
      return {
        text: line, action: KEEP,
        taste: hits.map(function (h) { return h.taste; }).filter(Boolean),
        rules: hits.map(function (h) { return h.id; }),
        reason: "含数据/结论——按 R1 删减哲学保留，结构不动",
        candidate: "", direction: "重要数据与结论，不要删；只在确有冗余时精简措辞",
      };
    }
    if (!hits.length) {
      /* R3 只作提示不作判据：缺具体名词/梗是"没加分"，不是"有毛病"——

      if (NOUN_RE.test(line) || MEME_RE.test(line)) {
        return { text: line, action: KEEP, taste: [], rules: [],
                 reason: "未命中腔调规则，且已含具体名词或梗——在风格空间内",
                 candidate: "", direction: "" };
      }
      return { text: line, action: KEEP, taste: [], rules: [],
               reason: "未命中腔调规则——没有需要删改的腔调",
               candidate: "",
               direction: "若这是文案（不是功能标签）：可以补一个具体名词或梗，让它落到实物上（定稿里 60% 含具体名词，被毙稿只有 19%）" };
    }

    var ids = hits.map(function (h) { return h.id; });
    var tastes = hits.map(function (h) { return h.taste; }).filter(Boolean);
    var res = mechanicalCandidate(line, ids);
    var cand = res[0], direction = res[1], driver = res[2];
    var manual = false;
    for (var k = 0; k < ids.length; k++) if (ids[k].indexOf("T-MANUAL") === 0) manual = true;
    var action;
    if (manual) action = DELETE;
    else if (cand) action = REWRITE;
    else {
      var hasSubstance = stripTrailingParen(line).length > 14;
      action = hasSubstance ? REWRITE : DELETE;
    }
    var top = null;
    for (var t = 0; t < hits.length; t++) if (hits[t].id === driver) { top = hits[t]; break; }
    if (!top) {
      var SEV = { high: 3, medium: 2, low: 1, hint: 0 };
      top = hits[0];
      for (var u = 1; u < hits.length; u++) {
        if ((SEV[hits[u].severity] || 0) > (SEV[top.severity] || 0)) top = hits[u];
      }
    }
    return {
      text: line, action: action, taste: tastes, rules: ids,
      reason: top.explanation.trim().split("。")[0] + "。",
      candidate: cand, direction: direction,
    };
  }

  function rewriteText(text, rules) {
    var compiled = compile(rules);
    var advices = [];
    var lines = String(text).split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      advices.push(classifyLine(line, compiled));
    }
    return { advices: advices };
  }

  return { rewriteText: rewriteText, classifyLine: classifyLine,
           KEEP: KEEP, REWRITE: REWRITE, DELETE: DELETE };
});

  const explained = new Set();
  // 同句多规则聚成一条（与 CLI _group_by_sentence 同口径）：标题合并规则名，
  // 严重级取组内最高——否则同一句会在多个严重级里各出现一次
  const sevRank = { high: 0, medium: 1, low: 2 };
  const groups = [];
  const byKey = new Map();
  const docLevel = [];
  F.forEach(f => {
    if (f.para < 0) { docLevel.push(f); return; }
    const key = f.para + "\u0000" + f.sentence;
    if (!byKey.has(key)) {
      const g = { para: f.para, sentence: f.sentence, items: [] };
      byKey.set(key, g);
      groups.push(g);
    }
    byKey.get(key).items.push(f);
  });
  groups.sort((a, b) => {
    const ra = Math.min(...a.items.map(i => sevRank[i.severity]));
    const rb = Math.min(...b.items.map(i => sevRank[i.severity]));
    return (ra - rb) || (a.para - b.para);
  });
  groups.forEach(g => {
    const top = g.items.reduce((acc, i) =>
      (sevRank[i.severity] < sevRank[acc.severity] ? i : acc), g.items[0]);
    const ids = g.items.map(i => i.rule_id).join(" + ");
    const names = g.items.map(i => i.rule_name).join(" + ");
    const taste = [...new Set(g.items.map(i => i.taste).filter(Boolean))].join("/");
    const matches = [...new Set(g.items.flatMap(i => i.matches))].join("、");
    const sent = g.sentence.length > 66 ? g.sentence.slice(0, 63) + "…" : g.sentence;
    const why = g.items.find(i => !explained.has(i.rule_id));
    if (why) explained.add(why.rule_id);
    g.items.forEach(i => explained.add(i.rule_id));
    parts.push(`<div class="found">
      <div class="head"><span class="dot" style="background:var(--sev-${top.severity})"></span>${sevName[top.severity]} · ${esc(ids)} ${esc(names)}${taste ? `<span class="taste">${esc(taste)}</span>` : ""}<span class="loc">¶${g.para + 1}</span></div>
      ${sent ? `<blockquote>${esc(sent)}</blockquote>` : ""}
      ${matches ? `<div class="match">命中：<code>${esc(matches)}</code></div>` : ""}
      ${why ? `<div class="why">${esc(why.explanation.trim())}</div>${why.suggestion ? `<div class="tip">→ ${esc(why.suggestion.trim())}</div>` : ""}` : ""}
    </div>`);
  });
  docLevel.sort((a, b) => sevRank[a.severity] - sevRank[b.severity]).forEach(f => {
    const taste = f.taste ? `<span class="taste">${esc(f.taste)}</span>` : "";
    const why = !explained.has(f.rule_id);
    explained.add(f.rule_id);
    parts.push(`<div class="found">
      <div class="head"><span class="dot" style="background:var(--sev-${f.severity})"></span>${sevName[f.severity]} · ${esc(f.rule_id)} ${esc(f.rule_name)}${taste}<span class="loc">全文</span></div>
      ${f.matches.length ? `<div class="match">命中：<code>${esc([...new Set(f.matches)].join("、"))}</code></div>` : ""}
      ${why ? `<div class="why">${esc(f.explanation.trim())}</div>${f.suggestion ? `<div class="tip">→ ${esc(f.suggestion.trim())}</div>` : ""}` : ""}
    </div>`);
  });

  if (result.hints.length) {
    parts.push(`<div class="hints"><div class="t">另有 ${result.hints.length} 处孤立弱命中（未达共现阈值，仅供参考）</div>` +
      result.hints.map(h => `<div class="h">· ${esc(h.rule_id)} ${esc(h.rule_name)}（¶${h.para + 1}）</div>`).join("") +
      `</div>`);
  }

  parts.push(`<div class="disclaimer">以上为写作风格提示，不是 AI 生成判定。命中≠AI——人类同样会写这些句式，单独任何一条都不构成证据。</div>`);
  el.innerHTML = parts.join("");
}

const EMPTY_REPORT = '<div class="empty">粘贴文本即出报告。</div>';

const ADVICE_META = { "删": ["del", "删"], "改": ["chg", "改"], "保留": ["keep", "留"] };

function renderAdvice(result) {
  const el = document.getElementById("report");
  const A = result.advices;
  const n = k => A.filter(a => a.action === k).length;
  const parts = [`<div class="counts">共 <b>${A.length}</b> 条 · 删 <b>${n("删")}</b> · 改 <b>${n("改")}</b> · 保留 <b>${n("保留")}</b></div>`];
  A.forEach(a => {
    const [cls, label] = ADVICE_META[a.action] || ["keep", "?"];
    const taste = a.taste.length ? `<span class="taste">${esc(a.taste.join("/"))}</span>` : "";
    parts.push(`<div class="advice ${cls}">
      <div class="line"><span class="tag">${label}</span>${esc(a.text)}${taste}</div>
      ${a.reason ? `<div class="why">${esc(a.reason)}</div>` : ""}
      ${a.candidate ? `<div class="cand">→ ${esc(a.candidate)}</div>` : ""}
      ${a.direction ? `<div class="dir">→ ${esc(a.direction)}</div>` : ""}
    </div>`);
  });
  parts.push(`<div class="disclaimer">改写准则：该多说时多说，该少说时少说，重要数据和结论要保留（R1）。梗需要人来补——这里只做规则化建议，不替你造梗。口味条目见 docs/taste_zhouao.md。</div>`);
  el.innerHTML = parts.join("");
}

function analyzeNow() {
  const text = document.getElementById("input").value;
  if (!text.trim()) {
    // 空文本不给"未发现"的假全清判定，回到初始提示
    document.getElementById("report").innerHTML = EMPTY_REPORT;
    return;
  }
  const rules = RULES_BY_PROFILE[currentProfile];
  if (currentMode === "rewrite") {
    renderAdvice(HvARewrite.rewriteText(text, rules));
    return;
  }
  renderReport(HvA.analyze(text, rules));
}

document.getElementById("input").addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(analyzeNow, 300);
});

renderProfiles();
renderModes();
</script>
