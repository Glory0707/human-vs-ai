# human-vs-ai 影评/短评场景规则库
# ============================
# 适用：影评、书评、剧集短评、商品点评。
# 校准语料：C-ReD film review 域（豆瓣真人评论 2960 vs 9 个当代模型生成，
# 2025-2026；800 篇平衡样本挖掘 + 1000 篇侦察，2026-09）。
#
# ⚠️ 边界（诚实标注）：短评中位仅 132 字、过 8 句门槛比例 0.2%——
# 本库不出综合评分（统计层无样本），只有词表层；且词表区分度温和，
# 挖掘最好单项仅 diff 0.06。它存在是因为短评是 AI 味重灾区（营销号
# 影评），但判断力有限，结论永远以"风格提示"对待。
#
# 校准记录（2026-09）：
#   - "镜头语言" AI 25/400 vs 真人 0——AI 影评的分析腔标签词
#   - "讲述了" AI 19 vs 真人 0——剧情复述腔，真人短评写具体细节
#   - "五星"真人 16 vs AI 0——真人写评分、AI 不写（真人正体词，
#     仅作校准注）
#   - "不得不说"真人 10 vs AI 0——反向，general 库的 G-SAFE-01
#     在此不成立，本库不收收束词

meta:
  name: review
  description: 影评/短评场景——影评书评与商品点评的模板化写作检测（短文本，词表层为主）

rules:
  # ============ 词表层 ============

  - id: R-ANALYT-01
    name: 分析腔标签词
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - 镜头语言
      - 叙事(节奏|结构)的?把握
      - (电影|影片)的?(美学|质感)|(视觉|美学)风格
      - 人物弧光
    explanation: >
      AI 影评爱贴影評教材的分析标签（"镜头语言""人物弧光"），
      真人短评更多直接说感受。C-ReD film review 实测"镜头语言"
      AI 25/400 vs 真人 0。标签词本身合法——但一篇短评里堆标签词
      而没有具体场面，就是模板影评。
    suggestion: 每个标签词后面跟一个具体场面或镜头；跟不出来就删。
    example_before: "这部电影镜头语言精妙，叙事结构把握得当，人物弧光完整。"
    example_after: "第三次看才发现，开场五分钟那个没关的水龙头是全片的倒计时。"

  - id: R-RECAP-01
    name: 剧情复述腔
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - (影片|电影|该剧|本剧|这本书)?讲述了
      - 故事(发生|围绕)在
      - (讲述|描绘)了.{0,16}(的)?故事
    explanation: >
      短评的功能是评价，不是复述剧情。"讲述了…的故事"是 AI 影评
      的默认骨架：C-ReD 实测 AI 19/400 vs 真人 0——真人默认读者
      看过，直接聊感受和证据。
    suggestion: 复述压到一句以内，把篇幅让给评价和具体证据。
    example_before: "影片讲述了主人公在困境中不断成长，最终实现自我救赎的故事。"
    example_after: "全片最好的是那份克制：父亲始终没说那句道歉，只多盛了一碗饭。"

  - id: L-NEGA-01
    name: 否定式排比
    tier: lexical
    scope: sentence
    severity: low   # 影评域区分度温和（AI 1.06 vs 真人 1.00）；共现才报
    patterns:
      - 不仅.{2,24}(，|、)?(而且|更是|还|甚至|也)
      - 不是.{2,24}(，|、)?而是
      - (不仅仅?是).{2,20}(更是|还是)
    explanation: >
      "不仅…更是"式拔高在影评里用于把一部作品拔成"一种现象"。
      C-ReD film review 实测区分度温和（加权命中 1.06 vs 1.00），
      只保留 low 共现门控。
    suggestion: 把"不仅…更是"拆成两个具体判断，各自给证据。
    example_before: "这不仅是一部电影，更是一次心灵的洗礼。"
    example_after: "散场时没人说话——这是今年第一部让我坐到字幕放完的片子。"

# 砍掉清单（本域实测反向或不达标，防复活）：
#   - 三连排比：真人 17 vs AI 5（真人短评也爱三连），方向反
#   - 不得不说：真人 10 vs AI 0，方向反（general 的 G-SAFE-01 不迁移）
#   - 五星：真人 16 vs AI 0——真人正体词（写评分），不设规则仅记录
#   - 统计层全部规则：短评中位 132 字、过 8 句门槛 0.2%，统计无样本，
#     本库不出综合评分（宁缺毋滥，同 official）
