# human-vs-ai 公文场景规则库
# ============================
# 适用：通知、意见、实施方案、行动方案等机关公文与公务文书。
# 校准语料：中国政府网/部委/省门户公开公文（tools/fetch_gov_corpus.py 等，
# 官方文件不受著作权保护，文本不入库）87 篇 + 构造 AI 公文样本 4 篇
# （tests/data/ai_official.txt）；当代拟合用 gen2026 当季 9 模型公文 70 篇。
#
# 与 academic/general 的根本不同：公文体本身就是"工整、模板化、排比"
# 的文体——"为了…根据…现将…通知如下""特此通知""一、(一)1."编号、
# "深入贯彻/落实/加强"都是公文正体，标了就是误伤。本库只抓两类东西：
# 1) AI 相对真人密度异常的成分（强化副词堆叠——词表只供密度统计）
# 2) 公文语域里不该出现的残留（演讲腔收尾、感叹号）
# 套话拔高/递进排比曾是规则，2026-09 二轮审计证实方向反转后撤出（见下）。
#
# 校准记录：2026-09 首轮，验收线 = 真公文误报率 < 20%（plan.md T4.2）
# 2026-09-27 二轮：O-INFL-01/O-PARA-01 撤出——gen2026 当代语料上反向
# （套话拔高真人 14 次 vs AI 1 次、递进排比真人 1 vs AI 0），公文正体
# 套话的检测由统计层反向系数（ngram/TTR）承担。证据见 docs/rules.md 砍掉清单。

meta:
  name: official
  description: 公文/公务文书场景——通知、意见、实施方案的模板化写作检测

rules:
  # ============ 词表层 ============

  - id: O-STK-01
    name: 强化副词堆叠
    tier: lexical
    scope: lexicon   # 只供 D-STKD 密度统计的词表——这些词个个都是公文正常词,
                     # 逐句命中必然 100% 误报(首轮评测实证),密度才是信号
    patterns:
      - 切实
      - 扎实
      - 进一步
      - 持续
      - 不断
      - 深入
      - 全面
      - 有力
      - 有效
      - 扎实推进
      - 大力
      - 着力
    explanation: >
      "切实/扎实/进一步/不断"是公文的基本工作动词修饰，真人篇篇在用，
      单次出现绝无问题。AI 的问题是密度：真人公文里它们集中在工作要求
      部分，AI 则均匀撒满全篇——每段都有三五个。是否"副词病"看全文
      密度（D-STKD），本规则只负责逐句定位供 D-STKD 计数。
    suggestion: 密度过高时逐段清理：保留真正需要强调的动词修饰，其余直陈动作。
    example_before: "切实加强组织领导，扎实推进任务落实，持续强化督查考核，不断深化机制建设。"
    example_after: "组织领导、任务落实、督查考核与机制建设分别明确到责任人。"

  - id: O-TAIL-01
    name: 演讲腔收尾
    tier: lexical
    scope: sentence
    severity: high
    patterns:
      - 相信在.{2,16}的(共同|携手)努力下
      - 让我们(以更加|携手|共同|以)
      - (使命|任务)光荣、?责任重大
      - 奋力开创新局面
      - 奋力谱写
      - 以优异成绩
    explanation: >
      动员演讲腔混进部署文件：真人通知/意见的收尾是"特此通知"或最后
      一条具体要求，不会有面向听众的号召——号召是领导讲话稿的文体，
      写进通知反而是 AI 把"政府文体"混成一锅的典型症状（训练语料里
      讲话稿与通知高度混杂）。中英社区鉴 AI 共识 + 维基清单 D 类的
      公文变体。
    suggestion: 通知以要求或"特此通知"收尾；确需动员表述，那是讲话稿的事，换文体写。
    example_before: "相信在各级各部门的共同努力下，我们一定能够开创工作新局面！"
    example_after: 「以最后一条工作要求收尾，或『特此通知』。」
    references:
      - https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing

  - id: O-EXCL-01
    name: 公文感叹号
    tier: syntactic
    scope: sentence
    severity: high
    patterns:
      - '[!！]'
    explanation: >
      真人公文正文（通知/意见/方案）几乎不用感叹号——感叹是情绪符号，
      公文靠职级与效力生效，不靠语气。AI 生成的"公文"常带演讲式感叹
      （"…而奋斗！"），一出现即异常。法规办法中的"！"同样异常。
    suggestion: 感叹号改句号；语气强度不该由标点承担。
    example_before: "让我们凝心聚力、真抓实干，为建设美丽家园而努力奋斗！"
    example_after: "（删除该段，或改为具体工作安排。）"

  # ============ 统计层（分档阈值见 docs/rules.md §5） ============

  - id: D-STKD-01
    name: 强化副词密度过高
    tier: statistical
    scope: doc
    severity: low
    doc_metric: conn_density
    doc_compare: above
    doc_threshold: 0.55
    explanation: >
      每句平均出现的强化副词超过 0.55 条。真人公文
      的强化副词集中在部署要求段落，AI 则均匀铺满——"每段都有三个
      进一步"是 AI 公文的直观印象在统计上的样子。阈值按真人公文
      分布实测校准。
    suggestion: 按"动词 + 宾语"直陈改写，强化词只留给真正需要加压的要求句。

  - id: D-PARA-01
    name: 段落长度一致
    tier: statistical
    scope: doc
    severity: low
    doc_metric: para_len_cv
    doc_compare: below
    doc_threshold: 0.25
    explanation: >
      各段长度过于接近（段长变异系数 < 0.25）意味着段落是按固定模板
      切的。注意公文的条款结构天然带来一定均匀性，阈值按公文真人
      语料实测校准。
    suggestion: 按内容单元重新分段：一个要求一个条，要求多寡决定段落长短。
    references:
      - https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing

  - id: D-DASH-01
    name: 破折号高频
    tier: statistical
    scope: doc
    severity: low
    doc_metric: dash_density
    doc_compare: above
    doc_threshold: 0.15
    explanation: >
      平均每句超过 0.15 个破折号。公文正文用括号或"即"引出解释，
      破折号是行文散文化的信号——AI 把散文化的标点习惯带进了公文。
    suggestion: 破折号换成括号或"即"。
    references:
      - https://github.com/blader/humanizer

# 综合评分（AI 味指数）：v0.17.8 落地，v0.29.0 随词表撤出重拟合。真人事务公文
# （gov.cn + 部委/省政府门户抓取 87 篇有效，过 8 句门槛 71 篇）vs gen2026 当季
# 9 模型公文 70 篇，类平衡逻辑回归（tools/fit_official.py）。全量 AUROC 0.957 /
# 分层留出 ×10 均值 0.934。特征注意：真人公文本身是套语复现+连接词密集文体，
# ngram_repeat/TTR 的判别方向与问答文体相反，模型已转负权重（低套语复现→AI）；
# 真人侧尾部≈7%（中共中央级规划体长文，特征与当代 AI 公文不可分，AI 语料全为
# 短文、长度外推未验证）——已知边界，见 docs/rules.md §8。
scoring:
  corpus: "真人事务公文 71 篇（gov.cn/部委/省门户）vs gen2026 当季 9 模型公文 70 篇，类平衡，2026-09（二轮重拟合 v0.29.0：O-INFL/O-PARA 撤出后）"
  intercept: 44.4248
  hit_density: 23.6565
  sentence_cv: 3.0339
  ttr: -44.3330
  ngram_repeat: -66.8477
  auroc: 0.957
  auroc_holdout: 0.934
  human_p50: 4
  human_p90: 58
  # 文种域外提示（v0.19.0）：系数绑定事务文种，印发类（通知+规划/方案全文
  # 附录）与批复类超出校准文种域——样本外同文种 AUROC 印发 0.294（反转）、
  # 批复 0.614，真人 p50 分别 76 / 63。开关放数据里，JS 端才可能同构。
  # 标定见 _qa/generalization-check.md、docs/rules.md §8
  genre_ood: true
  # 文种接管出分（v0.20.0）：两文种均出分抑制（score=None + 说明行）。
  # 测量（tools/genre_check.py，AI 84 篇 × 四省真人 75 篇，判定线 0.873
  # = 0.923 − 0.05，预声明于 design.md §4）：冻结系数同文种 AUROC 印发
  # 0.462（无信号）、批复 0.791（弱）；文种内二次校准分层 CV 批复 0.895
  # 看似可行，但渠道留一 LOCO 崩至 0.448——模型背下的是渠道风格而非作者
  # 信号，校准路线否决。抑制生效时不展示指数，仅保留规则发现与文种
  # 域外提示；文种系数仍可凭未来跨省配对语料按双道判定线重新申报
  genre_scoring:
    issuance-notice:
      suppress: true
    approval-reply:
      suppress: true
