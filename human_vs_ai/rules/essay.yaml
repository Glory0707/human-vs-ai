# human-vs-ai 作文/议论文场景规则库
# ============================
# 适用：高考作文、考场议论文、命题作文、征文。
# 校准语料：C-ReD composition 域（高考作文网页真人 1081 vs 9 个当代模型
# 生成，2025-2026；抽样 1000 篇侦察 + 800 篇平衡样本挖掘，2026-09）。
#
# 校准记录（2026-09，详见 docs/rules.md）：
#   - 否定式拔高 diff 0.30（"不是…而是"AI 104/250 vs 真人 28/250；
#     "不仅…更是" 84 vs 9）——议论文最强单项，academic 的 low 在此升 high
#   - 升华套话 AI 20:0 / 23:4（谱写篇章、绽放光彩）——真人高考作文
#     堆名言不堆套话
#   - 4-gram 重复反向（真人中位 0.023-0.028 vs AI 0.016-0.017）——
#     真人复现题目词组，D-NGRAM 不进本库
#   - 万能开场在域内复测成立（G-OPEN-01 同款"在这个…时代" AI 23:1）

meta:
  name: essay
  description: 作文/议论文场景——考场作文、命题作文与征文的模板化写作检测

rules:
  # ============ 词表层 ============

  - id: E-NEGA-01
    name: 否定式拔高
    tier: lexical
    scope: sentence
    severity: high
    patterns:
      - 不是.{2,24}(，|、)?而是
      - 不仅.{2,24}(，|、)?(而且|更是|还|甚至|也)
      - (不仅仅是?).{2,20}(更是|还是|更是对)
    explanation: >
      "不是 X 而是 Y""不仅 X 更是 Y"——用对仗替代论证，把具体事物
      拔高成抽象宣言。C-ReD composition 实测 AI 104/250 vs 真人 28/250
      （"不仅…更是" 84 vs 9），是议论文文体区分度最强的词表单项，
      故在本库升至 high（academic 库中同类为 low 共现门控）。
    suggestion: 每个"不是…而是"自问：X 和 Y 都是具体判断吗？拔高的那半句删掉，把另一半写实。
    example_before: "这不仅仅是一次比赛，更是对我们青春的礼赞。"
    example_after: "这次比赛让我第一次在 48 小时内完整走完建模流程。"

  - id: E-SUB-01
    name: 升华套话
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - (谱写|书写|绘就).{0,8}(篇章|华章|画卷)
      - (绽放|散发).{0,6}(光彩|光芒)
      - (青春|奋斗)(的)?(风采|底色|模样)
      - 找到属于自己的
      - 在人生的道路上
    explanation: >
      议论文结尾的通用升华件：拔出来能贴进任何题目的意象。
      C-ReD composition 实测"谱写…篇章"AI 20 篇 vs 真人 0 篇，
      "绽放…光彩" 23 vs 4。era 重挖补测：找到属于自己的 AI 6.5% 篇
      vs 真人 0.4%，在人生的道路上 AI 5.5% vs 真人 0.2%。真人高分
      作文收在具体判断上，不收在万能意象与人生感悟上。
    suggestion: 把意象换成这道题特有的具体判断；换不出来说明结尾还没想清楚。
    example_before: "愿我们都能谱写属于自己的青春华章，绽放耀眼光彩。"
    example_after: "回到题目里那个守岛人：他记了三十二年潮水，没有一天间断。"

  - id: E-FORM-01
    name: 公式化开头
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - 随着.{2,24}的(快速|不断|迅速|日益|持续)?(发展|进步|推进|深入|普及|提高)
      - 在当今(这个)?(快速发展的|信息化|数字化|全球化的?)?时代
      - 在.{2,12}的(背景|大背景|浪潮)下
      - 在这个(信息爆炸|快节奏|数字化|互联网|发展迅速|日新月异)?(的)?时代
      - (信息爆炸)(的)?(社会|时代)
      - 快节奏的(时代|生活|社会)
      - 日新月异
    explanation: >
      与 academic/general 同源的开场模板族。C-ReD composition 实测
      "在这个…时代" AI 23 篇 vs 真人 1 篇——考场作文真人开头直接
      入题，生成模型先铺时代背景。era 重挖补测：信息爆炸(的)社会/时代
      AI 6.4% 篇 vs 真人 0.2%，快节奏的时代/生活/社会 AI 7.0% vs 真人 0.4%。
    suggestion: 开头直接给观点或场景；时代背景与题目无关就整句删掉。
    example_before: "在这个日新月异的时代，坚持显得尤为珍贵。"
    example_after: "守岛人王继才的账本上记着三十二年的潮水。"

  - id: E-CONN-01
    name: 模板连接词
    tier: lexical
    scope: sentence
    severity: low   # 议论文允许结构词；共现密度过高才报
    patterns:
      - 首先
      - 其次
      - 再者
      - 此外
      - 与此同时
      - 不仅如此
      - 由此可见
      - 综上所述
      - 总而言之
      - 一言以蔽之
      - 更重要的是
    explanation: >
      议论文的骨架词，真人也用——但 AI 每段都装。C-ReD composition
      实测 AI 加权句均 1.63 vs 真人 1.13。单次出现不报，共现密度
      异常才提示。
    suggestion: 骨架词让位给内容衔接：前后句有真关系就不需要"首先其次"。

  - id: E-QUOTE-01
    name: 名言引入腔
    tier: lexical
    scope: sentence
    severity: low
    patterns:
      - 正如.{2,12}(所说|所言|而言)
      - 有一句话(说得好|这样说道)
      - 古人(云|曰|说)
      - 习近平总书记曾指出
    explanation: >
      "正如…所说"式的名言开场。真人高考作文也引名言，但 AI 把它
      当万能起手式（C-ReD 实测 AI 19 vs 真人 5）；引语若与后文论证
      无粘合，就是装饰品。
    suggestion: 引语后必须接你自己的转译：这句话在本题里意味着什么。
    example_before: "正如古人所言，千里之行始于足下。"
    example_after: "千里之行始于足下——但对这道题，起点是先算清成本曲线。"

  - id: G-TRIAD-01
    name: 三连排比
    tier: syntactic
    scope: sentence
    severity: low   # 议论文真人也排比；共现才报
    patterns:
      - '[\u4e00-\u9fa5]{2,8}[、][\u4e00-\u9fa5]{2,8}[、][\u4e00-\u9fa5]{2,8}(?!等)'
    explanation: >
      内容凑成三项一组。议论文文体 AI 仍偏高但差距温和
      （AI 86/250 vs 真人 66/250），与新闻文体相反（真人排比修养，
      反向），故只在 essay 库以 low 共现门控保留。
    suggestion: 逐项检查：凑数的删掉，能展开的展开成句。
    example_before: "它教会了我坚持、勇敢、担当。"
    example_after: "它教会我的只有一件小事：计时器响之前不碰手机。"

  # ============ 统计层（阈值按议论文文体校准） ============

  - id: D-UNIF-01
    name: 句长节奏均匀
    tier: statistical
    scope: doc
    severity: medium
    doc_metric: sentence_cv
    doc_compare: below
    doc_threshold: 0.40
    doc_tiers:
      - [600, 0.42]
    explanation: >
      真人议论文句长变异系数中位 0.59（AI 中位 0.39）——真人排比
      与短句起伏大。阈值取 0.40/0.42：真人 p10 之下、AI 中位之上。
    suggestion: 论据句可以更长更密，判断句敢用短句；连续等长的排比句拆掉一半。

# 综合评分：C-ReD composition 域全量拟合（类平衡，真人 1070 vs 7 模型 7544
# 过 8 句门槛样本），tools/fit_domain.py 产出。
scoring:
  corpus: "C-ReD essay 域（过 8 句门槛样本：真人 1070 vs 7 模型 7544，类平衡加权），2026-09 era 重拟合"
  intercept: -44.1715
  hit_density: 9.6652
  sentence_cv: -16.2585
  ttr: 53.8539
  ngram_repeat: 3.8401
  auroc: 0.954
  auroc_holdout: 0.953
  human_p50: 5
  human_p90: 55

# 砍掉清单（本域实测反向或不达标，防复活）：
#   - D-NGRAM 4-gram 重复：真人中位 0.023-0.028 vs AI 0.016-0.017
#     （真人复现题目词组），方向反
#   - D-DASH 破折号：真人/AI 中位均 0，无区分度
#   - 人生(就像|如同)：diff 0.012 不显著
#   - (扬帆|启航|远航)：真人 7 vs AI 2，方向反
