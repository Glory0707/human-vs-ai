# human-vs-ai 新闻/资讯场景规则库
# ============================
# 适用：新闻报道、资讯稿、通稿、自媒体转述新闻。
# 校准语料：C-ReD news 域（THUCNews 真人新闻 3000 vs 9 个当代模型生成，
# 2025-2026；抽样 1000 篇侦察 + 800 篇平衡样本挖掘，2026-09）。
#
# 校准记录（2026-09，详见 docs/rules.md）：
#   - 互动尾巴 diff 0.44（AI 134/250 vs 真人 24/250）——本库最强单项，
#     真人新闻几乎不给读者的操作指令
#   - "近日，"开场 diff 0.35（AI 101 vs 真人 13）——真记者写具体日期，
#     生成模型写模糊时间
#   - 三连排比反向（真人 71 vs AI 35，diff -0.14）——真记者的排比修养，
#     本库不收，与 general/essay 相反（词表不跨文体的又一实证）
#   - "据报道|据了解"反向（真人 15 vs AI 5）——真人消息源标注更规范
#   - 4-gram 重复反向（真人中位 0.042 vs AI 0.019）——真人新闻高频复现
#     实体名，D-NGRAM 不进本库
# era 重挖轮（v0.26.0，C-ReD news 全量：真人 2836 vs 九模型 ~2.9 万）：
#   - 新增 N-BUZZ-01 反响膨胀（AI 13.6% vs 真人 0.1%）；N-HEARSAY 扩
#     分析人士/数据显示/接受采访；N-RECENT 移除"日前"入砍掉清单

meta:
  name: news
  description: 新闻/资讯场景——报道、通稿与资讯内容的模板化写作检测

rules:
  # ============ 词表层 ============

  - id: N-INTERACT-01
    name: 互动尾巴混入报道
    tier: lexical
    scope: sentence
    severity: high
    patterns:
      - 欢迎在评论区
      - (点赞|收藏|转发|关注)(加|\+|、)?(收藏|转发|关注|走起)?
      - 希望这篇(文章|内容)?(对你)?(有所|有)?帮助
      - 如果(您|你)还有(其他|别的|任何)?(问题|疑问)
      - 让我们(一起|共同)?(期待|学习|进步)
      - 你们的(支持|点赞)就是
    explanation: >
      自媒体的运营话术混进了新闻报道：报道的事实停在正文，
      尾巴却在号召点赞关注。C-ReD news 域实测 AI 生成新闻 134/250 篇
      含互动话术，真人新闻 24/250——新闻体的第一暴露特征。
    suggestion: 报道到事实为止；引导互动的话术整句删除。
    example_before: "该政策将于下月施行。欢迎点赞收藏，关注我们了解最新消息。"
    example_after: "该政策将于下月施行。"

  - id: N-RECENT-01
    name: 模糊时间开场
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - 近日[，,]?
      - 最近[，,]?.{0,10}(引发|引起|传出)
    explanation: >
      "近日"是生成模型的时间占位符——真记者掌握信源和日期，
      会写"9 月 15 日"；写不出日期的，往往是没采访过。C-ReD news
      全量实测（真人 2836 vs 九模型 ~2.9 万）近日 AI 43.8% 篇 vs
      真人 8.0%。单次出现不算病，高频或开场即用才提示。
    suggestion: 换成可核实的具体日期或时间段；真不知道就写清获取时间。
    example_before: "近日，某市发布了新的垃圾分类管理办法。"
    example_after: "9 月 15 日，某市城管委发布《垃圾分类管理办法》，10 月 1 日起施行。"

  - id: N-HEARSAY-01
    name: 含糊消息源
    tier: lexical
    scope: sentence
    severity: low   # 真人简讯也用"据悉"；共现才报
    patterns:
      - 据悉
      - (有关|相关)(负责人|人士|部门)表示
      - 有(专家|学者|网友)认为
      - 分析人士(指出|认为|表示)
      - 数据显示
      - 接受(媒体)?采访时
    explanation: >
      "据悉/有关人士表示/数据显示"是无主信源——真正的报道会写
      "从市城管委获悉""据项目负责人王某"。era 重挖全量实测（真人 2836
      vs 九模型 ~2.9 万）：分析人士(指出|认为|表示) AI 13.9% 篇 vs 真人
      0.9%，数据显示 AI 19.1% vs 真人 3.6%，接受(媒体)采访时 AI 8.5%
      vs 真人 1.6%；据悉仅 1.8x 边缘，靠 low 共现门控兜底。注意
      "据报道/据了解"方向相反（真人消息源标注更规范），不收本条。
    suggestion: 补信源：谁说的、向谁核实、什么场合说的；补不出来就删掉这句。
    example_before: "据悉，该项目总投资超过十亿元。"
    example_after: "从市发改委获悉，该项目总投资 10.6 亿元。"

  - id: N-BUZZ-01
    name: 反响膨胀套话
    tier: lexical
    scope: sentence
    severity: medium
    patterns:
      - (引发|引起|受到|吸引)(了)?(社会各界的?)?(广泛|高度|热烈|强烈)关注
      - 的广泛关注
      - 引发(了)?(热议|轰动)
    explanation: >
      "引发广泛关注"是生成新闻的标配反响句——不写谁在关注、多少人在
      关注，直接宣布效果隆重。era 重挖全量实测，本条 pattern 合并
      doc 命中 AI 13.6% vs 真人 0.1%；裸词"广泛关注" AI 18.7% vs
      真人 0.2%。真人报道写具体反响（留言多少条、门店排队），
      不写空洞反响。
    suggestion: 写可核实的具体反响（人数、留言、销量）；拿不出就删掉这句。
    example_before: "该政策一经发布便引发了社会各界的广泛关注。"
    example_after: "政策发布三天，政务网下载量破 4 万次，评论区最热的一条问的是补贴怎么领。"

  - id: N-NOTE-01
    name: 编辑部提示语
    tier: lexical
    scope: sentence
    severity: low
    patterns:
      - 值得注意的是
      - 值得一提的是
      - 总体(来看|而言)
      - 总的来看
    explanation: >
      "值得注意的是/总体来看"是分析性文体的衔接词，混在消息报道里
      就是评论腔入侵报道体。C-ReD news 实测 AI 10:0 与 7:0。
    suggestion: 报道体只陈述事实与信源；分析判断另起评论稿。
    example_before: "值得注意的是，这是该市第三次调整方案。"
    example_after: "这是该市 2024 年以来第三次调整方案。"

  - id: L-CONN-01
    name: 模板连接词
    tier: lexical
    scope: sentence
    severity: low   # 与 academic 同名同词表；新闻里 AI 略高（1.24 vs 1.14）
    patterns:
      - 首先
      - 其次
      - 再者
      - 此外
      - 与此同时
      - 不仅如此
      - 由此可见
      - 综上所述
      - 总而言之
    explanation: >
      报道体靠事实推进，不靠议论连接词推进。C-ReD news 实测 AI 命中
      率 1.24 vs 真人 1.14（加权句均），差距温和，故仅设 low 共现门控。
    suggestion: 用事实的时序与因果自然衔接，删掉议论性过渡词。

  # ============ 统计层（阈值按新闻文体校准） ============

  - id: D-UNIF-01
    name: 句长节奏均匀
    tier: statistical
    scope: doc
    severity: medium
    doc_metric: sentence_cv
    doc_compare: below
    doc_threshold: 0.40
    doc_tiers:
      - [300, 0.36]
    explanation: >
      新闻真人句长变异系数中位 0.49（引语短句多、导语长句多），
      AI 生成新闻中位 0.34——消息体的"通稿腔"。阈值取 0.40：
      真人 p10 之下、AI 中位之上。300 字内过 8 句的样本太少，
      沿用 0.36 兜底。
    suggestion: 导语与引语错开长度；把连续等长的过程句合并，引语单独成句。

# 综合评分：C-ReD news 域全量拟合（类平衡，真人 1413 vs 7 模型 15112
# 过 8 句门槛样本），tools/fit_domain.py 产出；v0.26.0 era 重挖动词表后重拟合。
scoring:
  corpus: "C-ReD news 域（过 8 句门槛样本：真人 1413 vs 7 模型 15112，类平衡加权），2026-09 era 重拟合"
  intercept: -62.6212
  hit_density: 7.0997
  sentence_cv: -5.1318
  ttr: 67.7646
  ngram_repeat: -3.1777
  auroc: 0.951
  auroc_holdout: 0.948
  human_p50: 6
  human_p90: 55

# 砍掉清单（本库实测反向或不达标，防复活）：
#   - 三连排比：真人 71 vs AI 35（真记者排比修养），方向反
#   - 据报道|据了解：真人 15 vs AI 5（真人消息源标注规范），方向反
#   - D-NGRAM 4-gram 重复：真人中位 0.042 vs AI 0.019（实体名复现），方向反
#   - 记者(获悉|了解到)：真人 11 vs AI 2——真人正体词，仅作校准注不设规则
#   - 日前：真人 8.5% vs AI 2.6%（THUCNews 正体消息语，2026 模型不用）——
#     v0.26.0 era 全量复测反向，从 N-RECENT-01 移除
