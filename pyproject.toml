[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-vs-ai"
dynamic = ["version"]
description = "可解释的中文 AI 味分析器：逐句指出文本哪里像 AI、为什么像、怎么改。不判 AI 概率，只做写作风格归因。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Glory0707" }]
keywords = ["chinese", "ai-flavor", "writing", "linter", "academic-writing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ppl = ["torch>=2.0", "transformers>=4.40"]

[project.scripts]
human-vs-ai = "human_vs_ai.cli:main"

[tool.setuptools.packages.find]
include = ["human_vs_ai*"]

[tool.setuptools.dynamic]
version = { attr = "human_vs_ai.__version__" }

[tool.setuptools.package-data]
human_vs_ai = ["rules/*.yaml"]
